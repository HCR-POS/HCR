<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>南宫国际娱乐 · 后台管理系统</title>
<style>
:root{--bg:#0a1220;--sidebar:#0d1728;--panel:#1a263d;--panel2:#26375c;--line:#3b517a;--text:#f0f4f9;--dim:#8ba0c0;--gold:#fbbf24;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;--pink:#ec4899}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
/* 登录页 */
.login-page{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#1a2a4a 0%,#0a1220 80%);z-index:100;padding:20px}
.login-page.hidden{display:none}
.login-card{width:100%;max-width:400px;background:linear-gradient(135deg,#1e2d4a,#141b2e);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:36px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative;overflow:hidden}
.login-card::before{content:'';position:absolute;top:-50%;right:-20%;width:220px;height:220px;background:radial-gradient(circle,rgba(251,191,36,.25),transparent 65%);pointer-events:none}
.login-logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(251,191,36,.4);position:relative;z-index:1}
.login-title{font-size:22px;font-weight:900;text-align:center;margin-bottom:6px;background:linear-gradient(to right,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative;z-index:1}
.login-sub{font-size:12px;color:var(--dim);text-align:center;margin-bottom:26px;position:relative;z-index:1}
.login-field{margin-bottom:14px;position:relative;z-index:1}
.login-field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600}
.login-field input{width:100%;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;outline:none}
.login-field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
.login-btn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;font-size:15px;font-weight:900;border:none;margin-top:10px;position:relative;z-index:1}
.login-btn:active{transform:scale(.98)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
/* 主布局 */
.admin-app{display:none;min-height:100vh}
.admin-app.show{display:flex}
.sidebar{width:220px;background:var(--sidebar);border-right:1px solid var(--line);position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:50;transition:transform .3s}
.sidebar-header{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sidebar-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sidebar-title{font-size:14px;font-weight:900;background:linear-gradient(to right,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-sub{font-size:10px;color:var(--dim);margin-top:2px}
.nav{padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:2px;transition:all .2s}
.nav-item:hover{background:rgba(251,191,36,.08);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(245,158,11,.1));color:var(--gold);box-shadow:inset 0 0 0 1px rgba(251,191,36,.3)}
.nav-item .ni-icon{font-size:16px;width:20px;text-align:center}
.nav-group{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding:14px 14px 6px;font-weight:700}
.main-content{flex:1;margin-left:220px;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--sidebar);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:12px}
.menu-toggle{display:none;width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:18px;align-items:center;justify-content:center}
.topbar-title{font-size:16px;font-weight:800}
.topbar-right{display:flex;align-items:center;gap:12px}
.admin-info{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;font-size:12px}
.admin-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:14px}
.btn-logout{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:20px;font-size:11px}
.btn-logout:hover{color:var(--red);border-color:var(--red)}
.page-content{padding:20px;flex:1}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-header h2{font-size:22px;font-weight:900}
.page-header .ph-sub{font-size:12px;color:var(--dim);margin-top:4px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;border-color:transparent}
.btn.success{background:linear-gradient(135deg,#10b981,#047857);color:#fff;border-color:transparent}
.btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:-50%;right:-30%;width:120px;height:120px;background:radial-gradient(circle,rgba(251,191,36,.15),transparent 65%);pointer-events:none}
.stat-label{font-size:11px;color:var(--dim);margin-bottom:6px}
.stat-value{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.stat-value.gold{color:var(--gold)}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.blue{color:#60a5fa}
.stat-value.purple{color:var(--purple)}
.stat-extra{font-size:10px;color:var(--dim);margin-top:4px}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:rgba(0,0,0,.25);color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:rgba(251,191,36,.04)}
tr:last-child td{border-bottom:none}
td.actions{white-space:nowrap}
.badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:800}
.badge.green{background:rgba(16,185,129,.2);color:#34d399}
.badge.gold{background:rgba(251,191,36,.2);color:var(--gold)}
.badge.red{background:rgba(239,68,68,.2);color:#f87171}
.badge.blue{background:rgba(59,130,246,.2);color:#60a5fa}
.badge.gray{background:rgba(139,160,192,.15);color:var(--dim)}
.badge.purple{background:rgba(139,92,246,.2);color:#a78bfa}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold)}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;overflow-y:auto}
.modal-mask.show{display:flex}
.modal{width:100%;max-width:600px;background:var(--panel);border-radius:16px;border:1px solid var(--line);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:800}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.admin-toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--panel);border:1px solid var(--line);padding:12px 24px;border-radius:12px;font-size:13px;font-weight:700;z-index:300;transition:transform .3s;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.admin-toast.show{transform:translateX(-50%) translateY(0)}
.admin-toast.success{border-color:var(--green);color:var(--green)}
.admin-toast.error{border-color:var(--red);color:var(--red)}
.admin-toast.info{border-color:var(--blue);color:#60a5fa}
.search-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-bar input,.search-bar select{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:12px;outline:none;min-width:140px}
.search-bar input:focus,.search-bar select:focus{border-color:var(--gold)}
.empty{padding:60px 20px;text-align:center;color:var(--dim)}
.empty .e-icon{font-size:48px;opacity:.4;margin-bottom:10px}
.empty .e-text{font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;color:var(--dim);background:var(--panel);border:1px solid var(--line);cursor:pointer}
.tab.active{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;border-color:transparent}
.switch{position:relative;width:44px;height:24px;background:var(--panel2);border-radius:12px;cursor:pointer;transition:all .2s;border:1px solid var(--line);display:inline-block;vertical-align:middle}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:all .2s}
.switch.on{background:var(--green);border-color:var(--green)}
.switch.on::after{left:22px}
.pagination{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pagination button{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:12px;font-weight:700}
.pagination button.active{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;border-color:transparent}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main-content{margin-left:0}
.menu-toggle{display:flex}
.form-row,.form-row-3{grid-template-columns:1fr}
.stat-grid{grid-template-columns:repeat(2,1fr)}
.page-content{padding:14px}
.admin-info .admin-name{display:none}
}
</style>
</head><body>

<!-- Toast -->
<div class="admin-toast" id="adminToast"></div><script>
// ================================================================
// 【工具函数】
// ================================================================
function $(id){return document.getElementById(id);}
function setText(el,t){if(el&&el.textContent!==String(t))el.textContent=String(t);}
function padZero(n,l){var s=String(n);while(s.length<l)s='0'+s;return s;}
function fmtMoney(n){return Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtInt(n){return Number(n||0).toLocaleString('zh-CN');}
function fmtTime(ts){if(!ts)return '-';var d=new Date(ts);return d.getFullYear()+'-'+padZero(d.getMonth()+1,2)+'-'+padZero(d.getDate(),2)+' '+padZero(d.getHours(),2)+':'+padZero(d.getMinutes(),2)+':'+padZero(d.getSeconds(),2);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+padZero(d.getMonth()+1,2)+'-'+padZero(d.getDate(),2);}
function maskName(name){if(!name)return '***';if(name.length<=2)return name.charAt(0)+'*';if(name.length<=4)return name.charAt(0)+'**'+name.charAt(name.length-1);return name.charAt(0)+'***'+name.charAt(name.length-1);}
function genId(prefix){return (prefix||'ID')+Date.now()+Math.floor(Math.random()*1000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}

function toast(msg,type){
var el=$('adminToast');
if(!el)return;
el.className='admin-toast '+(type||'');
el.textContent=msg;
setTimeout(function(){el.classList.add('show');},10);
clearTimeout(el._t);
el._t=setTimeout(function(){el.classList.remove('show');},2000);
}

function openModal(title,bodyHtml,footHtml){
setText($('modalTitle'),title);
$('modalBody').innerHTML=bodyHtml||'';
$('modalFoot').innerHTML=footHtml||'<button class="btn" onclick="closeModal()" type="button">关闭</button>';
$('modalMask').classList.add('show');
}
function closeModal(){$('modalMask').classList.remove('show');}

// ---- 通道配置 ----

function getStats(){
var users=AdminDB.getUsers();
var funds=AdminDB.getFunds();
var bets=AdminDB.getBets();
var today=todayStr();
var todayStart=new Date(today).getTime();
var s={
totalUsers:users.length,
todayRecharge:0,todayWithdraw:0,todayBet:0,todayPayout:0,
pendingRecharge:0,pendingWithdraw:0,
frozenUsers:0,
onlineCount:Math.floor(Math.random()*2000)+500
};
users.forEach(function(u){if(u.frozen)s.frozenUsers++;});
funds.forEach(function(f){
if(f.ts>=todayStart){
if(f.type==='充值')s.todayRecharge+=Math.abs(f.amount);
if(f.type==='提现')s.todayWithdraw+=Math.abs(f.amount);
}
});
bets.forEach(function(b){
if(b.ts>=todayStart){s.todayBet+=b.bet;s.todayPayout+=b.payout;}
});
s.profit=s.todayBet-s.todayPayout;
return s;
}

function renderUsers(c){

html+='<div class="table-wrap"><table><thead><tr><th>ID</th><th>手机号</th><th>昵称</th><th>VIP</th><th>余额</th><th>状态</th><th>实名</th><th>最后活跃</th><th>操作</th></tr></thead><tbody id="userTbody"></tbody></table></div>';
html+='<div class="pagination" id="userPage"></div>';
c.innerHTML=html;
setTimeout(function(){
var ft=$('userFt');if(ft)ft.value=userFilter;
var kw=$('userKw');if(kw)kw.onkeydown=function(e){if(e.key==='Enter')applyUserFilter();};
},20);
renderUserList();
}

function applyUserFilter(){
userKeyword=($('userKw').value||'').trim();
userFilter=$('userFt').value;
userPage=1;
renderUserList();
}

function getFilteredUsers(){
var list=AdminDB.getUsers().slice();
if(userKeyword){
var kw=userKeyword.toLowerCase();
list=list.filter(function(u){
return String(u.id||'').indexOf(kw)>=0||(u.phone||'').indexOf(kw)>=0||(u.nickname||'').toLowerCase().indexOf(kw)>=0;
});
}
if(userFilter==='vip')list=list.filter(function(u){return (u.vipLevel||0)>0;});
else if(userFilter==='frozen')list=list.filter(function(u){return u.frozen;});
else if(userFilter==='verified')list=list.filter(function(u){return u.realName==='已认证';});
return list;
}

function renderUserList(){
var list=getFilteredUsers();
var total=list.length;
var totalPages=Math.max(1,Math.ceil(total/userPageSize));
if(userPage>totalPages)userPage=totalPages;
var start=(userPage-1)*userPageSize;
var pageList=list.slice(start,start+userPageSize);

var tbody=$('userTbody');
if(!tbody)return;
tbody.textContent='';
if(pageList.length===0){
tbody.innerHTML='<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--dim);">暂无数据<br><span style="font-size:10px;">用户端注册后自动出现</span></td></tr>';
}else{
pageList.forEach(function(u){
var tr=document.createElement('tr');
var statusHtml=u.frozen?'<span class="badge red">已冻结</span>':'<span class="badge green">正常</span>';
var realHtml=u.realName==='已认证'?'<span class="badge green">已认证</span>':'<span class="badge gray">未认证</span>';
var vipHtml='<span class="badge gold">VIP '+(u.vipLevel||0)+'</span>';
tr.innerHTML='<td style="font-size:10px;">'+esc(u.id||'-')+'</td>'
+'<td>'+esc(u.phone||'-')+'</td>'
+'<td>'+esc(u.nickname||'-')+'</td>'
+'<td>'+vipHtml+'</td>'
+'<td style="color:var(--gold);font-weight:800;">¥'+fmtMoney(u.coins||0)+'</td>'
+'<td>'+statusHtml+'</td>'
+'<td>'+realHtml+'</td>'
+'<td style="font-size:11px;color:var(--dim);">'+fmtTime(u.lastActive)+'</td>'
+'<td class="actions"><button class="btn small" onclick="viewUser(\''+esc(u.id)+'\')" type="button">查看</button> <button class="btn small ghost" onclick="toggleFreeze(\''+esc(u.id)+'\')" type="button">'+(u.frozen?'解冻':'冻结')+'</button></td>';
tbody.appendChild(tr);
});
}

var pg=$('userPage');
if(!pg)return;
pg.textContent='';
if(totalPages<=1)return;
var prevBtn=document.createElement('button');
prevBtn.textContent='‹';
prevBtn.disabled=userPage<=1;
prevBtn.onclick=function(){if(userPage>1){userPage--;renderUserList();}};
pg.appendChild(prevBtn);
var pages=[];
for(var i=1;i<=totalPages;i++){
if(i===1||i===totalPages||Math.abs(i-userPage)<=2)pages.push(i);
else if(pages[pages.length-1]!=='...')pages.push('...');
}
pages.forEach(function(p){
if(p==='...'){var sp=document.createElement('span');sp.textContent='...';sp.style.padding='8px';pg.appendChild(sp);return;}
var b=document.createElement('button');
b.textContent=p;
if(p===userPage)b.classList.add('active');
b.onclick=function(){userPage=p;renderUserList();};
pg.appendChild(b);
});
var nextBtn=document.createElement('button');
nextBtn.textContent='›';
nextBtn.disabled=userPage>=totalPages;
nextBtn.onclick=function(){if(userPage<totalPages){userPage++;renderUserList();}};
pg.appendChild(nextBtn);
}

function saveUserCoins(id){
var v=parseFloat($('editCoins').value);
if(isNaN(v)||v<0){toast('请输入有效金额','error');return;}
var list=AdminDB.getUsers();
for(var i=0;i<list.length;i++){
if(list[i].id===id){
var old=list[i].coins||0;
list[i].coins=v;
AdminDB.saveUsers(list);
AdminDB.addLog('修改用户 '+id+' 余额 '+old+' → '+v);
toast('余额已更新','success');
closeModal();
renderUserList();
return;
}
}
toast('用户不存在','error');
}

function toggleFreeze(id){
var list=AdminDB.getUsers();
for(var i=0;i<list.length;i++){
if(list[i].id===id){
list[i].frozen=!list[i].frozen;
AdminDB.saveUsers(list);
AdminDB.addLog((list[i].frozen?'冻结':'解冻')+'用户 '+id);
toast(list[i].frozen?'已冻结':'已解冻',list[i].frozen?'error':'success');
renderUserList();
return;
}
}
}

function saveLuckyGame(){

function saveWheelGame(key){
var durInput=document.querySelector('[data-wg="'+key+'_dur"]');
var rateInput=document.querySelector('[data-wg="'+key+'_rate"]');

g[key].duration=parseInt(durInput.value,10)||6000;
var rateVal=rateInput.value.trim();

AdminDB.saveGame(g);
AdminDB.addLog('修改'+g[key].name+'配置');
toast(g[key].name+' 配置已保存','success');
}

+'<div class="form-group"><label>状态</label><select id="anActive"><option value="1"'+(isEdit&&a.active?' selected':'')+'>启用</option><option value="0"'+(isEdit&&!a.active?' selected':'')+'>停用</option></select></div>'
+'<div style="font-size:11px;color:var(--dim);margin-top:8px;">💡 发布后，用户端 30 秒内自动弹窗显示</div>';
openModal(isEdit?'编辑公告':'发布公告',html,
'<button class="btn" onclick="closeModal()" type="button">取消</button>'
+'<button class="btn primary" onclick="saveAnnounce('+(isEdit?"'"+a.id+"'":'null')+')" type="button">保存并发布</button>'
);
}

function saveAnnounce(id){
var title=($('anTitle').value||'').trim();
var content=($('anContent').value||'').trim();
var active=$('anActive').value==='1';
if(!title||!content){toast('请填写完整','error');return;}
var list=AdminDB.getAnnounce();
if(id){
for(var i=0;i<list.length;i++){
if(list[i].id===id){
list[i].title=title;list[i].content=content;list[i].active=active;list[i].ts=Date.now();
break;
}
}
AdminDB.addLog('编辑公告 '+title);
}else{
list.unshift({id:'AN'+Date.now(),title:title,content:content,active:active,ts:Date.now()});
AdminDB.addLog('发布公告 '+title);
}
AdminDB.saveAnnounce(list);
toast('公告已保存','success');
closeModal();
renderAnnounce($('pageContent'));
}

function editAnnounce(id){
var list=AdminDB.getAnnounce();
var a=null;
for(var i=0;i<list.length;i++){if(list[i].id===id){a=list[i];break;}}
if(a)openAnnounceEdit(a);
}

function toggleAnnounce(id){
var list=AdminDB.getAnnounce();
for(var i=0;i<list.length;i++){
if(list[i].id===id){list[i].active=!list[i].active;break;}
}
AdminDB.saveAnnounce(list);
toast('已切换状态','success');
renderAnnounce($('pageContent'));
}

function delAnnounce(id){
if(!confirm('确认删除此公告？'))return;
var list=AdminDB.getAnnounce();
list=list.filter(function(x){return x.id!==id;});
AdminDB.saveAnnounce(list);
AdminDB.addLog('删除公告 '+id);
toast('已删除','success');
renderAnnounce($('pageContent'));
}

function renderReport(c){
var users=AdminDB.getUsers();
var funds=AdminDB.getFunds();
var bets=AdminDB.getBets();
var totalRecharge=0,totalWithdraw=0,totalBet=0,totalPayout=0;
funds.forEach(function(f){
if(f.type==='充值')totalRecharge+=Math.abs(f.amount);
if(f.type==='提现')totalWithdraw+=Math.abs(f.amount);
});
bets.forEach(function(b){totalBet+=b.bet;totalPayout+=b.payout;});
var html='';
html+='<div class="page-header"><div><h2>📈 报表统计</h2><div class="ph-sub">平台运营数据总览</div></div><div class="page-actions"><button class="btn" onclick="exportReport()" type="button">📥 导出报表</button></div></div>';
html+='<div class="stat-grid">';
html+='<div class="stat-card"><div class="stat-label">累计充值</div><div class="stat-value gold">¥'+fmtMoney(totalRecharge)+'</div></div>';
html+='<div class="stat-card"><div class="stat-label">累计提现</div><div class="stat-value red">¥'+fmtMoney(totalWithdraw)+'</div></div>';
html+='<div class="stat-card"><div class="stat-label">累计投注</div><div class="stat-value gold">¥'+fmtMoney(totalBet)+'</div></div>';
html+='<div class="stat-card"><div class="stat-label">累计派奖</div><div class="stat-value green">¥'+fmtMoney(totalPayout)+'</div></div>';
var profit=totalBet-totalPayout;
html+='<div class="stat-card"><div class="stat-label">平台盈亏</div><div class="stat-value '+(profit>=0?'green':'red')+'">'+(profit>=0?'+':'-')+'¥'+fmtMoney(Math.abs(profit))+'</div></div>';
html+='<div class="stat-card"><div class="stat-label">净充值</div><div class="stat-value blue">¥'+fmtMoney(totalRecharge-totalWithdraw)+'</div></div>';
html+='</div>';

html+='<div class="card"><div class="card-title">📊 用户排行（余额 TOP 10）</div>';
var topUsers=users.slice().sort(function(a,b){return (b.coins||0)-(a.coins||0);}).slice(0,10);
if(topUsers.length===0){
html+='<div class="empty" style="padding:20px;"><div class="e-text">暂无用户数据</div></div>';
}else{
html+='<div class="table-wrap"><table><thead><tr><th>排名</th><th>用户ID</th><th>手机号</th><th>昵称</th><th>VIP</th><th>余额</th></tr></thead><tbody>';
topUsers.forEach(function(u,i){
html+='<tr><td><span class="badge '+(i<3?'gold':'gray')+'">#'+(i+1)+'</span></td><td style="font-size:10px;">'+esc(u.id)+'</td><td>'+esc(u.phone||'-')+'</td><td>'+esc(u.nickname||'-')+'</td><td>VIP '+(u.vipLevel||0)+'</td><td style="color:var(--gold);font-weight:800;">¥'+fmtMoney(u.coins||0)+'</td></tr>';
});
html+='</tbody></table></div>';
}
html+='</div>';
c.innerHTML=html;
}

function exportReport(){
var users=AdminDB.getUsers();
var funds=AdminDB.getFunds();
var bets=AdminDB.getBets();
var lines=['南宫国际娱乐 · 报表导出','导出时间,'+new Date().toLocaleString(),'','=== 用户列表 ===','用户ID,手机号,昵称,VIP,余额,实名'];
users.forEach(function(u){lines.push([u.id,u.phone,u.nickname,'VIP'+(u.vipLevel||0),u.coins||0,u.realName||'未认证'].join(','));});
lines.push('');
lines.push('=== 资金流水（最近200条） ===');
lines.push('用户,手机号,类型,金额,时间');
funds.slice(0,200).forEach(function(f){lines.push([f.nickname||'-',f.userId||'-',f.type,f.amount,fmtTime(f.ts)].join(','));});
lines.push('');
lines.push('=== 投注记录（最近200条） ===');
lines.push('用户,期号,开奖号码,押注,派奖,时间');
bets.slice(0,200).forEach(function(b){lines.push([b.nickname||'-',b.round||'-',b.winId||0,b.bet,b.payout,fmtTime(b.ts)].join(','));});
var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;a.download='report_'+Date.now()+'.csv';a.click();
setTimeout(function(){URL.revokeObjectURL(url);},1000);
AdminDB.addLog('导出报表');
toast('报表已导出','success');
}

function addAdmin(){
var id=($('admId').value||'').trim();
var name=($('admName').value||'').trim();
var pwd=($('admPwd').value||'').trim();
var role=$('admRole').value;
if(!id||!name||!pwd){toast('请填写完整','error');return;}
if(id.length<3){toast('账号至少3位','error');return;}
if(pwd.length<6){toast('密码至少6位','error');return;}
var list=AdminDB.getAdmins();
for(var i=0;i<list.length;i++){
if(list[i].id===id){toast('账号已存在','error');return;}
}
list.push({id:id,name:name,pwd:pwd,role:role,createdAt:Date.now()});
AdminDB.saveAdmins(list);
AdminDB.addLog('开通管理员 '+id);
toast('管理员已开通','success');
closeModal();
renderAdmins($('pageContent'));
}

function delAdmin(id){
if(!confirm('确认删除管理员「'+id+'」？'))return;
var list=AdminDB.getAdmins();
list=list.filter(function(x){return x.id!==id;});
AdminDB.saveAdmins(list);
AdminDB.addLog('删除管理员 '+id);
toast('已删除','success');
renderAdmins($('pageContent'));
}

function openChangePwd(id){
var target=null;
var list=AdminDB.getAdmins();
for(var i=0;i<list.length;i++){if(list[i].id===id){target=list[i];break;}}
if(!target){toast('账号不存在','error');return;}
var html='<div class="form-group"><label>账号</label><input type="text" value="'+esc(target.id)+'" readonly></div>'
+'<div class="form-group"><label>当前密码</label><input type="password" id="cpOld" placeholder="请输入当前密码" autocomplete="off"></div>'
+'<div class="form-group"><label>新密码</label><input type="password" id="cpNew" placeholder="至少6位" autocomplete="off"></div>'
+'<div class="form-group"><label>确认新密码</label><input type="password" id="cpNew2" placeholder="请再次输入新密码" autocomplete="off"></div>';
openModal('修改密码 · '+target.id,html,
'<button class="btn" onclick="closeModal()" type="button">取消</button>'
+'<button class="btn primary" onclick="saveChangePwd(\''+esc(id)+'\')" type="button">确认修改</button>'
);
}

function saveChangePwd(id){
var oldP=($('cpOld').value||'').trim();
var newP=($('cpNew').value||'').trim();
var newP2=($('cpNew2').value||'').trim();
if(!oldP||!newP||!newP2){toast('请填写完整','error');return;}
if(newP.length<6){toast('新密码至少6位','error');return;}
if(newP!==newP2){toast('两次密码不一致','error');return;}
var list=AdminDB.getAdmins();
for(var i=0;i<list.length;i++){
if(list[i].id===id){
if(list[i].pwd!==oldP){toast('当前密码错误','error');return;}
list[i].pwd=newP;
AdminDB.saveAdmins(list);
AdminDB.addLog('修改账号 '+id+' 密码');
toast('密码已修改，请重新登录','success');
closeModal();
setTimeout(function(){
if(id=== (currentAdmin?currentAdmin.id:'')){
doLogout();
}
},600);
return;
}
}
toast('账号不存在','error');
}

function exportAllData(){
var data={
admins:AdminDB.getAdmins(),
announcements:AdminDB.getAnnounce(),
users:AdminDB.getUsers(),
funds:AdminDB.getFunds(),
bets:AdminDB.getBets(),
game:AdminDB.getGame(),
vip:AdminDB.getVip(),
channel:AdminDB.getChannel(),
activity:AdminDB.getActivity(),
setting:AdminDB.getSetting(),
logs:AdminDB.getLogs()
};
var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;a.download='nangong_backup_'+Date.now()+'.json';a.click();
setTimeout(function(){URL.revokeObjectURL(url);},1000);
toast('数据已导出','success');

function importAllData(){
var input=document.createElement('input');
input.type='file';input.accept='.json';
input.onchange=function(e){
var file=e.target.files[0];
if(!file)return;
var reader=new FileReader();
reader.onload=function(ev){
try{
var d=JSON.parse(ev.target.result);
if(d.admins)localStorage.setItem(AdminDB.KEY_ADMINS,JSON.stringify(d.admins));
if(d.announcements)localStorage.setItem(AdminDB.KEY_ANNOUNCE,JSON.stringify(d.announcements));
if(d.game)localStorage.setItem(AdminDB.KEY_GAME,JSON.stringify(d.game));
if(d.vip)localStorage.setItem(AdminDB.KEY_VIP,JSON.stringify(d.vip));
if(d.channel)localStorage.setItem(AdminDB.KEY_CHANNEL,JSON.stringify(d.channel));
if(d.activity)localStorage.setItem(AdminDB.KEY_ACTIVITY,JSON.stringify(d.activity));
if(d.setting)localStorage.setItem(AdminDB.KEY_SETTING,JSON.stringify(d.setting));
toast('数据已导入，刷新页面生效','success');
setTimeout(function(){location.reload();},1500);
}catch(err){toast('文件格式错误','error');}
};
reader.readAsText(file);
};
input.click();
}

function resetAllData(){
if(!confirm('⚠️ 确认重置所有后台配置？此操作不可恢复！'))return;
if(!confirm('再次确认：公告、游戏配置、VIP、通道配置将被重置！'))return;
localStorage.removeItem(AdminDB.KEY_ANNOUNCE);
localStorage.removeItem(AdminDB.KEY_GAME);
localStorage.removeItem(AdminDB.KEY_VIP);
localStorage.removeItem(AdminDB.KEY_CHANNEL);
localStorage.removeItem(AdminDB.KEY_ACTIVITY);
localStorage.removeItem(AdminDB.KEY_SETTING);
localStorage.removeItem(AdminDB.KEY_LOGS);
toast('配置已重置','success');
setTimeout(function(){location.reload();},1500);
}

// 【启动】
// ================================================================
function startAdmin(){
buildNav();
navTo('dashboard');
}

function bindGlobalEvents(){
$('loginBtn').onclick=doLogin;
$('loginPass').onkeydown=function(e){if(e.key==='Enter')doLogin();};
$('loginUser').onkeydown=function(e){if(e.key==='Enter')$('loginPass').focus();};
$('logoutBtn').onclick=doLogout;
$('menuToggle').onclick=function(){$('sidebar').classList.toggle('open');};
$('modalClose').onclick=closeModal;
$('modalMask').onclick=function(e){if(e.target===this)closeModal();};
}

function boot(){
AdminDB.getAdmins();
AdminDB.getGame();
AdminDB.getVip();
AdminDB.getChannel();
AdminDB.getActivity();
AdminDB.getSetting();
bindGlobalEvents();
var cur=AdminDB.getCurrent();
if(cur&&cur.id){
var admins=AdminDB.getAdmins();
var found=null;
for(var i=0;i<admins.length;i++){if(admins[i].id===cur.id){found=admins[i];break;}}
if(found){
currentAdmin=found;
$('loginPage').classList.add('hidden');
$('adminApp').classList.add('show');
setText($('adminName'),found.name||found.id);
startAdmin();
}
}
console.log('[Admin] 后台管理系统已加载');
}

if(document.readyState==='loading'){
document.addEventListener('DOMContentLoaded',boot);
}else{
boot();
}
</script>
